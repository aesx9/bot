# Mismo flujo que `make check` en local (lint + mypy + tests + pip-audit + detect-secrets),
# pero obligatorio: el pre-commit solo protege si alguien lo instaló en su copia.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # detect-secrets recorre los ficheros versionados
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Entorno (dependencias fijadas con hash)
        run: make venv install
      - name: make check
        run: make check
