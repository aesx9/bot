id: ml-daily-direction-multiasset-v3

version: 3

status: preregistered

preregistered_utc_date: "2026-10-10"
frozen_note: >
  Congelado. El hash SHA-256 de este archivo exacto está en
  decisions/decision_log.md. Cualquier cambio requiere un experiment_id nuevo.

created_utc_date: "2026-10-10"
live_trading: false

lineage:
  supersedes: ml-daily-direction-multiasset-v1 (versión 2, hypotheses/ml_daily_direction_multiasset.yaml)
  previous_file_preserved: true
  previous_file_role: >
    Registro de la regla original de la puerta del universo y de su resultado
    formal (opción 2, S = 2022). No se edita.
  reason: >
    Corrección metodológica tras la auditoría de datos: la regla original
    contaba pares retirados y no activos desaparecidos. La retirada de pares
    cruzados y las migraciones de ticker se confunden con desapariciones de
    activos. La corrección se toma antes de calcular ningún resultado de
    rentabilidad de esta estrategia.
  decision_log_entry: "decisions/decision_log.md, 2026-10-10: Corrección metodológica del universo (versión 3)"
  no_merging_of_results_or_conclusions_across_versions: true

