# /etc/logrotate.d/copybot
# Solo los logs. Los CSV (trades, funding, fills, fees, equity) NO se rotan:
# son el registro para informes y para Hacienda.
# El bot usa WatchedFileHandler (logging.external_rotation = true en config):
# reabre el fichero cuando logrotate lo mueve, sin perder líneas.
/var/lib/copybot/data/*/logs/*.log {
    daily
    rotate 60
    compress
    delaycompress
    missingok
    notifempty
    create 0600 copybot copybot
    su copybot copybot
}
